# Checks the pushed files before they leave the machine, with the versions the lock pins (CI runs the same).
# Install once: `uv run lefthook install`.
pre-push:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {push_files}
    ruff-check:
      glob: "*.py"
      run: uv run ruff check {push_files}
    ty:
      glob: "*.py"
      run: uv run ty check
    lock:
      glob: "{pyproject.toml,uv.lock}"
      run: uv lock --check
