name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # Bytecode compiled once here, rather than by every pytest worker at the same time.
      - run: uv sync --locked --all-extras --compile-bytecode
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      # The conformance runs mostly wait on the network and timers: more workers than CPUs, idle ones take over queued tests.
      - run: uv run pytest -n 8 --dist worksteal

  # The single check the branch rules require.
  ci:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
