# Release pull request on every push to main; when it is merged, publishes the package to PyPI
# through trusted publishing (environment `pypi`). Run by hand with a tag, it publishes that existing
# release again (when its publication failed after the release was created).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release to publish, e.g. v0.4.0.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push'
    uses: nestor-home/.github/.github/workflows/release-please.yml@main
    secrets: inherit
    with:
      automerge: true  # publish as soon as a release is ready: dependencies follow on their own

  pypi:
    needs: release
    if: always() && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - run: uv publish --trusted-publishing always
